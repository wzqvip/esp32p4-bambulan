name: build

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch cJSON
        run: git clone --depth 1 -b v1.7.18 https://github.com/DaveGamble/cJSON.git /tmp/cjson
      - name: Parser tests
        run: make -C test/host CJSON=/tmp/cjson

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/bambu_screen.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args
